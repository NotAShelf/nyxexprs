follows = { nixpkgs = "nixpkgs" }

[inputs.inquisitor]
url     = "github:NotAShelf/inquisitor"
follows = { nixpkgs = "nixpkgs" }

[inputs.licenseit]
url     = "github:notashelf/licenseit"
follows = { nixpkgs = "nixpkgs" }

[inputs.microfetch]
url     = "github:notashelf/microfetch"
follows = { nixpkgs = "nixpkgs" }

[inputs.mrc]
url     = "github:notashelf/mrc"
follows = { nixpkgs = "nixpkgs" }

[inputs.ndg]
url     = "github:feel-co/ndg"
follows = { nixpkgs = "nixpkgs" }

[inputs.nh]
