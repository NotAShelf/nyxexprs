[shorturls]
gh = "github:{path}"

[inputs.eh]
url     = "github:notashelf/eh"
follows = { nixpkgs = "nixpkgs" }

[inputs.flint]
url     = "github:NotAShelf/flint"
follows = { nixpkgs = "nixpkgs" }

[inputs.gcolor]
url     = "github:notashelf/gcolor"
