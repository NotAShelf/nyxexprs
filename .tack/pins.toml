[inputs.nil]
url     = "github:oxalica/nil"
follows = { nixpkgs = "nixpkgs" }

[inputs.nixpkgs]
url = "github:NixOS/nixpkgs/nixos-unstable"

[inputs.stash]
url     = "github:notashelf/stash"
