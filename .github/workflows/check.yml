name: Run Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        operation:
          - check
          - format
    uses: $/.github/workflows/nix.yml
    with:
      operation: ${{ matrix.operation }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build:
    needs: check
    uses: $/.github/workflows/build.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
