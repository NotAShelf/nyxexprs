name: Update packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # daily

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'notashelf/nyxexprs'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ secrets.GH_TOKEN}}"
          persist-credentials: true

      - name: "Install Nix"
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nyx
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Update tack pins
        run: nix run .#tack -- update
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "[CI]: update tack pins"
          push_options: "--force"
          commit_user_name: GitHub Actions
