name: Update packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # daily

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'notashelf/nyxexprs'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: "${{ secrets.GH_TOKEN}}"
          persist-credentials: true

      - name: "Install Nix"
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nyx
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Update tack pins
        run: nix run .#tack -- update
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "[CI]: update tack pins"
          push_options: "--force"
          commit_user_name: GitHub Actions
