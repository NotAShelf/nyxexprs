name: Nix

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      package:
        required: false
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: "Install Nix"
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nyx
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Run Nix operation
        env:
          OPERATION: ${{ inputs.operation }}
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$OPERATION" in
            check) nix flake check --accept-flake-config ;;
            format) nix run .#alejandra-custom -- -c . -e ./.tack ;;
            build) nix build ".#$PACKAGE" ;;
            *) printf 'Unknown Nix operation: %s\n' "$OPERATION" >&2; exit 1 ;;
          esac
