name: Nix

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      package:
        required: false
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Nix"
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nyx
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Run Nix operation
        env:
          OPERATION: ${{ inputs.operation }}
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$OPERATION" in
            check) nix flake check --accept-flake-config ;;
            format) nix run .#alejandra-custom -- -c . -e ./.tack ;;
            build) nix build ".#$PACKAGE" ;;
            *) printf 'Unknown Nix operation: %s\n' "$OPERATION" >&2; exit 1 ;;
          esac
