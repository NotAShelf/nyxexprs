name: Build

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  find-uncached:
    name: "Find uncached packages"
    if: github.repository == 'notashelf/nyxexprs'
    runs-on: ubuntu-latest
    outputs:
      uncached: ${{ steps.get-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Nix"
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nyx

      - name: Find packages missing in the cache
        id: get-packages
        run: |
          set -euo pipefail

          package_names="$(nix eval --json --apply builtins.attrNames .#packages.x86_64-linux | jq --raw-output '.[] | "packages.x86_64-linux.\(.)"')"
          packages='[]'
          while read -r package; do
            [[ -n "$package" ]] || continue
            path="$(nix eval --raw ".#${package}.outPath")"
            cached="$(nix path-info --json --json-format 1 --store https://nyx.cachix.org "$path" | jq --raw-output --arg path "$path" '.[$path] != null')"
            if [[ "$cached" == false ]]; then
              echo "Building $package"
              packages="$(jq --arg package "$package" --compact-output '. + [$package]' <<< "$packages")"
            fi
          done <<< "$package_names"

          printf 'packages=%s\n' "$packages" >> "$GITHUB_OUTPUT"
  build-uncached:
    needs: find-uncached
    if: needs.find-uncached.outputs.uncached != '[]'
    strategy:
      matrix:
        package: ${{ fromJSON(needs.find-uncached.outputs.uncached) }}
    uses: $/.github/workflows/nix.yml
    with:
      operation: build
      package: ${{ matrix.package }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
